plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"medievalships" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "medievalships-test"
		enableGameTests = false
		enableClientGameTests = true
		// Running the game in CI requires accepting the Minecraft EULA (https://aka.ms/MinecraftEULA)
		eula = true
	}
}

loom {
	runs {
		configureEach {
			// tests in CI: no network synchronisation, more time for slow virtual machines
			vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// ------------------------------------------------------------------ production in-game tests
// Runs the real game with the remapped jars, exactly like a player's mods folder
// (our mod + Fabric API + the test mod + optional mods dropped in libs/, e.g. Lithium).
configurations {
	productionMods {
		transitive = false
	}
}

dependencies {
	productionMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	if (file("libs/lithium.jar").exists()) {
		productionMods files("libs/lithium.jar")
	}
}

tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	destinationDirectory = layout.buildDirectory.dir("devlibs")
	archiveClassifier = "gametest"
}

tasks.register("remapGametestJar", net.fabricmc.loom.task.RemapJarTask) {
	dependsOn gametestJar
	inputFile = gametestJar.archiveFile
	archiveClassifier = "gametest"
	addNestedDependencies = false
	classpath.from(sourceSets.gametest.compileClasspath)
}

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	dependsOn remapJar, remapGametestJar
	mods.from(configurations.productionMods)
	mods.from(remapJar.archiveFile)
	mods.from(remapGametestJar.archiveFile)
	jvmArgs.addAll([
		"-Dfabric.client.gametest",
		"-Dfabric.client.gametest.disableNetworkSynchronizer=true"
	])
}
