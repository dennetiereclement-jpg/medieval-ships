name: Build

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Read version
        run: echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: medieval-ships-${{ env.MOD_VERSION }}
          path: build/libs/medieval-ships-${{ env.MOD_VERSION }}.jar
      - name: Publish the jar (branch builds)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/jar && cp build/libs/medieval-ships-${MOD_VERSION}.jar /tmp/jar/
          cd /tmp/jar && git init -q && git checkout -q -b builds
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "medieval-ships ${MOD_VERSION} (${GITHUB_SHA})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
      - name: Publish the build log (failed builds)
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ || true
          cp -r build/test-results /tmp/log/ 2>/dev/null || true
          L=build-log; [ "${GITHUB_REF_NAME}" != main ] && L="$L-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          cd /tmp/log && git init -q && git checkout -q -b "$L"
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q -m "build log ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$L"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/
