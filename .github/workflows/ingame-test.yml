name: In-game test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-gametest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, lithium, decor, sodium]
    env:
      MS_TEST_MINIMAL: ${{ matrix.variant == 'minimal' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Lithium (compatibility variant)
        if: matrix.variant == 'lithium'
        run: |
          mkdir -p libs
          url=$(curl -s 'https://api.modrinth.com/v2/project/lithium/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].files[0].url')
          echo "Lithium: $url"
          curl -sL -o libs/lithium.jar "$url"
          ls -la libs
      - name: Download the decoration mods the Nautilus furniture comes from (decor variant)
        if: matrix.variant == 'decor'
        run: |
          mkdir -p libs
          # downloaded from Modrinth for the test only: never committed nor shipped with the mod
          for q in furnish-furniture farmers-delight-refabricated farmhouse-decorations lands-of-icaria; do
            slug=$(curl -s "https://api.modrinth.com/v2/project/$q" | jq -r '.slug // empty')
            if [ -z "$slug" ]; then
              slug=$(curl -s "https://api.modrinth.com/v2/search?query=$q&facets=%5B%5B%22project_type%3Amod%22%5D%5D" | jq -r --arg w "${q%%-*}" '[.hits[] | select(.title | ascii_downcase | contains($w))][0].slug // empty')
            fi
            url=$(curl -s "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].files[0].url // empty')
            echo "$q -> $slug -> $url"
            [ -n "$url" ] && curl -sL -o "libs/$slug.jar" "$url" || true
          done
          ls -la libs
      - name: Download Sodium (chunk meshing pipeline variant, 1.28.1)
        if: matrix.variant == 'sodium'
        run: |
          mkdir -p libs /tmp/out
          # the latest release (not a beta) for this game version, downloaded from Modrinth for the test only
          json=$(curl -s 'https://api.modrinth.com/v2/project/sodium/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D')
          url=$(echo "$json" | jq -r '[.[] | select(.version_type == "release")][0].files[0].url // .[0].files[0].url')
          echo "Sodium: $(echo "$json" | jq -r '[.[] | select(.version_type == "release")][0].version_number // .[0].version_number') $url"
          curl -sL -o libs/sodium.jar "$url"
          ls -la libs
          # evidence from the real jar, kept with the results: Sodium's Fabric fluid renderer looks the handler up in
          # FluidRenderHandlerRegistry and renders through FluidRendering.render (FluidRenderHandler#renderFluid)
          {
            echo "== classes of the jar about fluids"; unzip -l libs/sodium.jar | grep -i fluid
            echo; echo "== net.caffeinemc.mods.sodium.fabric.render.FluidRendererImpl (javap -p -c, calls only)"
            javap -p -c -cp libs/sodium.jar net.caffeinemc.mods.sodium.fabric.render.FluidRendererImpl | grep -E "^  [a-z].*\(|^[a-z].*class|invoke(static|virtual|interface|special)"
          } > /tmp/out/sodium-fluid-renderer.txt 2>&1 || true
          cat /tmp/out/sodium-fluid-renderer.txt
      - name: Install virtual display
        # the runners' default mirror (azure.archive.ubuntu.com) sometimes fails to resolve: retry, then fall back to
        # archive.ubuntu.com (2026-11-11: every run failed here for hours)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils && exit 0
            echo "apt failed (attempt $i), switching the mirror"
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            sleep 30
          done
          exit 1
      - name: Run the real client with the mod
        # 1.9.0 (three more flying vessels and the shared features): ~48 min with the decoration mods
        # 1.27.0 (lot 2 ships): ~74 min with the decoration mods (one run hit 75): 90
        # 1.27.0 integration (17 market tents + the three city ships together): 1.26.0 alone took 66-73 min, each ship
        # branch 62-77 min; the three ships add several minutes each: 110 (job 120)
        # 1.28.1: the sodium variant (Fabric API + Sodium) runs the same scenario on Sodium's chunk meshing pipeline
        timeout-minutes: 110
        run: |
          set -o pipefail
          # the decoration mods need a newer Fabric Loader than the one the mod is built against
          extra=""
          if [ "${{ matrix.variant }}" = "decor" ]; then extra="-Ploader_version=0.19.5"; fi
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runProductionClientGameTest $extra --stacktrace -Dfabric.client.gametest.disableNetworkSynchronizer=true 2>&1 | tee /tmp/gradle-output.txt
      - name: Publish report and screenshots (branch test-results)
        if: always()
        run: |
          mkdir -p /tmp/out
          find . -name "latest.log" -not -path "./.git/*" | head -5
          tail -n 400 /tmp/gradle-output.txt > /tmp/out/gradle-output.txt 2>/dev/null || true
          find . -name "medievalships-test.txt" -not -path "./.git/*" -exec cp {} /tmp/out/ \; || true
          ls -la libs > /tmp/out/libs.txt 2>/dev/null || true
          find . -path "*screenshots*" -name "*.png" -not -path "./.git/*" -exec cp {} /tmp/out/ \; || true
          f=$(find . -path "*logs*" -name "latest.log" -not -path "./.git/*" | head -1); [ -n "$f" ] && cp "$f" /tmp/out/latest.log || true
          find . -name "*.log" -newer build.gradle -not -path "./.git/*" -not -path "./.gradle/*" | head -20 > /tmp/out/logfiles.txt || true
          cd /tmp/out && ls -la
          # results of main on test-results-<variant>, of another branch on test-results-<variant>-<branch>
          R="test-results-${{ matrix.variant }}"; [ "${GITHUB_REF_NAME}" != main ] && R="$R-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          git init -q && git checkout -q -b "$R"
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q --allow-empty -m "In-game test results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$R"
