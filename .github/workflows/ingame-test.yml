name: In-game test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-gametest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, lithium, decor]
    env:
      MS_TEST_MINIMAL: ${{ matrix.variant == 'minimal' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Lithium (compatibility variant)
        if: matrix.variant == 'lithium'
        run: |
          mkdir -p libs
          url=$(curl -s 'https://api.modrinth.com/v2/project/lithium/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].files[0].url')
          echo "Lithium: $url"
          curl -sL -o libs/lithium.jar "$url"
          ls -la libs
      - name: Download the decoration mods the Nautilus furniture comes from (decor variant)
        if: matrix.variant == 'decor'
        run: |
          mkdir -p libs
          # downloaded from Modrinth for the test only: never committed nor shipped with the mod
          for q in furnish-furniture farmers-delight-refabricated farmhouse-decorations lands-of-icaria; do
            slug=$(curl -s "https://api.modrinth.com/v2/project/$q" | jq -r '.slug // empty')
            if [ -z "$slug" ]; then
              slug=$(curl -s "https://api.modrinth.com/v2/search?query=$q&facets=%5B%5B%22project_type%3Amod%22%5D%5D" | jq -r --arg w "${q%%-*}" '[.hits[] | select(.title | ascii_downcase | contains($w))][0].slug // empty')
            fi
            url=$(curl -s "https://api.modrinth.com/v2/project/$slug/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].files[0].url // empty')
            echo "$q -> $slug -> $url"
            [ -n "$url" ] && curl -sL -o "libs/$slug.jar" "$url" || true
          done
          ls -la libs
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils
      - name: Run the real client with the mod
        timeout-minutes: 22
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runProductionClientGameTest --stacktrace -Dfabric.client.gametest.disableNetworkSynchronizer=true 2>&1 | tee /tmp/gradle-output.txt
      - name: Publish report and screenshots (branch test-results)
        if: always()
        run: |
          mkdir -p /tmp/out
          find . -name "latest.log" -not -path "./.git/*" | head -5
          tail -n 400 /tmp/gradle-output.txt > /tmp/out/gradle-output.txt 2>/dev/null || true
          find . -name "medievalships-test.txt" -not -path "./.git/*" -exec cp {} /tmp/out/ \; || true
          find . -path "*screenshots*" -name "*.png" -not -path "./.git/*" -exec cp {} /tmp/out/ \; || true
          f=$(find . -path "*logs*" -name "latest.log" -not -path "./.git/*" | head -1); [ -n "$f" ] && cp "$f" /tmp/out/latest.log || true
          find . -name "*.log" -newer build.gradle -not -path "./.git/*" -not -path "./.gradle/*" | head -20 > /tmp/out/logfiles.txt || true
          cd /tmp/out && ls -la
          git init -q && git checkout -q -b test-results-${{ matrix.variant }}
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -q --allow-empty -m "In-game test results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-results-${{ matrix.variant }}
