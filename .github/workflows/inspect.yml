name: Inspect Minecraft sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile
        run: ./gradlew genSources --stacktrace
      - name: Extract classes needed for debugging
        run: |
          set -x
          mkdir -p /tmp/ref
          find ~/.gradle .gradle -name "*.jar" 2>/dev/null | grep -i "minecraft" | grep -i "sources" | tee /tmp/ref/jars.txt
          for j in $(cat /tmp/ref/jars.txt); do
            unzip -o -q "$j" 'net/minecraft/entity/Entity.java' 'net/minecraft/server/network/ServerPlayNetworkHandler.java' \
              'net/minecraft/world/EntityView.java' 'net/minecraft/world/CollisionView.java' 'net/minecraft/entity/LivingEntity.java' \
              'net/minecraft/client/network/ClientPlayerEntity.java' 'net/minecraft/entity/player/PlayerEntity.java' \
              'net/minecraft/client/world/ClientWorld.java' 'net/minecraft/entity/vehicle/AbstractBoatEntity.java' \
              'net/minecraft/client/render/GameRenderer.java' -d /tmp/ref/src 2>/dev/null || true
          done
          find /tmp/ref/src -name "*.java" | head -20
      - name: Push to a temporary branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-ref
          git rm -rf -q .
          cp -r /tmp/ref/src ./ref || true
          cp /tmp/ref/jars.txt ./ || true
          git add -A
          git commit -q -m "Decompiled reference (temporary, for debugging)"
          git push -f origin ci-ref
